name: "💡 Suggestion / Пропозиція"
description: "Suggest a product, workflow, or documentation improvement / Запропонувати вдосконалення продукту чи UX"
title: "[Suggestion]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the user-visible behavior you propose. Use the bug or navigation-output template when existing behavior is broken.

        Спочатку опишіть проблему, потім запропоновану поведінку, видиму користувачу. Якщо наявна функція працює неправильно, скористайтеся шаблоном помилки або виводу навігації.

  - type: checkboxes
    id: existing_issue
    attributes:
      label: Existing issue / Наявна пропозиція
      options:
        - label: I searched existing issues and did not find the same proposal. / Я перевірив наявні issues та не знайшов такої самої пропозиції.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case / Проблема або сценарій
      description: What is difficult, missing, or unnecessarily slow today? / Чого зараз бракує або що працює незручно чи надто повільно?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / Запропонована поведінка
      description: Describe the result rather than an internal implementation. / Опишіть результат, а не внутрішню реалізацію.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Product area / Частина продукту
      options:
        - Navigation output, HUD, or TBT / Вивід навігації, HUD або TBT
        - Dashboard projection / Вивід на приборку
        - Waze functions / Функції Waze
        - Google Maps functions / Функції Google Maps
        - Apps and navigator downloads / Застосунки та завантаження навігаторів
        - Navigator patcher / Патчер навігаторів
        - Storage, logs, or diagnostics / Сховище, логи або діагностика
        - Options, permissions, or background runtime / Налаштування, дозволи або фонова робота
        - Installation or update / Встановлення або оновлення
        - Documentation or contribution workflow / Документація або робота з репозиторієм
        - Other / Інше
    validations:
      required: true

  - type: textarea
    id: vehicle_scope
    attributes:
      label: Vehicle scope / Автомобіль
      description: Optional. Add model, year, market, DiLink, and firmware only when the suggestion is vehicle-specific. Do not include VIN. / Необов'язково. Додайте модель, рік, ринок, DiLink і прошивку, лише якщо пропозиція залежить від автомобіля. Не додавайте VIN.

  - type: textarea
    id: acceptance
    attributes:
      label: What would make this complete? / Критерій готовності
      description: List observable outcomes or an example workflow. / Перелічіть перевірювані результати або приклад сценарію.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / Розглянуті альтернативи
      description: Optional. Explain current workarounds or a simpler variant. / Необов'язково. Опишіть поточний обхідний шлях або простіший варіант.

  - type: textarea
    id: context
    attributes:
      label: Additional context / Додатковий контекст
      description: Add mockups or redacted examples when they materially clarify the proposal. / Додайте макети або очищені приклади, якщо вони суттєво уточнюють пропозицію.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation / Перевірка приватності
      options:
        - label: Any attachments are free of credentials and unnecessary private data. / Вкладення не містять облікових даних і зайвих приватних даних.
          required: true
